name: PR title

# Squash-merge turns the PR title into the conventional commit on main, so
# this is the single enforcement point — no commitlint hooks needed locally.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce conventional commit title (no scopes)
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if printf '%s' "$TITLE" | grep -qE '^(feat|fix|perf|refactor|chore|docs|test|ci)!?: .+'; then
            echo "OK: $TITLE"
          else
            echo "PR title must be '<type>: <summary>' with type one of:"
            echo "  feat fix perf refactor chore docs test ci   (add ! for breaking)"
            echo "Scopes are not allowed: 'feat: add export', never 'feat(api): add export'."
            echo "Got: $TITLE"
            exit 1
          fi
