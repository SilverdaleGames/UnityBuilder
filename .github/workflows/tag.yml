name: Release tag

# Keep this workflow only when AGENTS.md selects the SemVer profile.
# On merge to main, bump a SemVer tag from Conventional Commit messages since
# the last tag: feat: -> minor, fix:/perf: -> patch, a type with "!" (feat!:)
# or a "BREAKING CHANGE:" footer -> major. Nothing release-worthy -> no new
# tag. The first ever tag starts at v0.1.0. Scoped types (feat(api):) are not
# part of the convention and do not match.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute and push SemVer tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          LAST="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)"
          if [ -z "$LAST" ]; then
            TAG="v0.1.0"
            echo "No existing tag — starting at ${TAG}"
          else
            MSGS="$(git log --format='%s%n%b' "${LAST}..HEAD")"
            if printf '%s\n' "$MSGS" | grep -qE '^[a-z]+!:' || printf '%s\n' "$MSGS" | grep -qE '^BREAKING CHANGE:'; then
              BUMP="major"
            elif printf '%s\n' "$MSGS" | grep -qE '^feat:'; then
              BUMP="minor"
            elif printf '%s\n' "$MSGS" | grep -qE '^(fix|perf):'; then
              BUMP="patch"
            else
              echo "No feat/fix/breaking commits since ${LAST} — no version bump."
              exit 0
            fi
            IFS=. read -r MA MI PA <<< "${LAST#v}"
            case "$BUMP" in
              major) MA=$((MA + 1)); MI=0; PA=0 ;;
              minor) MI=$((MI + 1)); PA=0 ;;
              patch) PA=$((PA + 1)) ;;
            esac
            TAG="v${MA}.${MI}.${PA}"
            echo "Bump ${BUMP}: ${LAST} -> ${TAG}"
          fi

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists, skipping."
            exit 0
          fi
          git tag -a "$TAG" -m "Release ${TAG}"
          git push origin "$TAG"
