name: CI

on:
  push:
    branches: [development, main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate package structure
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool package.json >/dev/null
          while IFS= read -r asmdef; do
            python3 -m json.tool "$asmdef" >/dev/null
          done < <(find Editor Tests -name '*.asmdef' | sort)

          test "$(python3 -c 'import json; print(json.load(open("package.json"))["name"])')" = "com.silverdale.unity-builder"
          test "$(python3 -c 'import json; print(json.load(open("Editor/Core/Silverdale.UnityBuilder.Editor.asmdef"))["name"])')" = "Silverdale.UnityBuilder.Editor"
          test "$(python3 -c 'import json; print(json.load(open("Editor/Core/Silverdale.UnityBuilder.Editor.asmdef"))["includePlatforms"][0])')" = "Editor"

      - name: Verify Unity metadata
        shell: bash
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r asset; do
            case "$asset" in *.meta) continue ;; esac
            if [ ! -f "${asset}.meta" ]; then
              echo "Missing metadata: ${asset}.meta"
              status=1
            fi
          done < <(find Editor Tests docs -mindepth 1 \( -type f -o -type d \) | sort)

          for asset in AGENTS.md CLAUDE.md LICENSE README.md REPO-STANDARDS.md package.json Editor Tests docs; do
            if [ ! -f "${asset}.meta" ]; then
              echo "Missing metadata: ${asset}.meta"
              status=1
            fi
          done
          exit "$status"

      - name: Check package isolation
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'AnimalPark|EditorGlobalReferencesManager|UploadGoogleCloudStorage|GameVersion' Editor --include='*.cs'; then
            echo "Project-specific code must stay outside the reusable package."
            exit 1
          fi

      - name: Check whitespace
        shell: bash
        run: git show --check --format= HEAD
